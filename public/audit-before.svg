<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Old dental practice website mockup">
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="0" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1ECE2" />
      <stop offset="100%" stop-color="#E0D5BD" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#b-bg)" />

  <!-- Browser chrome -->
  <rect width="1200" height="56" fill="#CDC4B0" />
  <circle cx="28" cy="28" r="8" fill="#D86F6F" />
  <circle cx="56" cy="28" r="8" fill="#E2B95C" />
  <circle cx="84" cy="28" r="8" fill="#7FB28A" />
  <rect x="160" y="14" width="640" height="28" rx="6" fill="#F5EFE3" />
  <text x="180" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#7B6C50">http://dr-smith-dental.example.co.uk/home.html</text>

  <!-- Hero (cramped, outdated) -->
  <rect x="40" y="96" width="1120" height="200" fill="#F7EFDF" stroke="#C7B894" stroke-width="2" />
  <text x="80" y="160" font-family="'Times New Roman', Times, serif" font-size="48" fill="#5C3F1F" font-weight="bold">Dr Smith Dental Surgery</text>
  <text x="80" y="200" font-family="'Comic Sans MS', cursive" font-size="22" fill="#9B6F2B">Family dentistry for over 25 years!</text>
  <text x="80" y="240" font-family="Verdana, sans-serif" font-size="18" fill="#4A3A1E">Call us today: 0161 555 0199  Mon-Fri 9-5</text>
  <rect x="80" y="256" width="180" height="34" fill="#C24B4B" />
  <text x="170" y="280" text-anchor="middle" font-family="Verdana, sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">Click Here For Info</text>

  <!-- Navigation bar - cluttered -->
  <rect x="40" y="312" width="1120" height="40" fill="#A98C5A" />
  <g font-family="Verdana, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">
    <text x="60" y="338">HOME</text>
    <text x="130" y="338">ABOUT US</text>
    <text x="220" y="338">TREATMENTS</text>
    <text x="330" y="338">FEES</text>
    <text x="390" y="338">NEW PATIENTS</text>
    <text x="520" y="338">FAQ</text>
    <text x="580" y="338">CONTACT</text>
    <text x="670" y="338">EMERGENCY</text>
    <text x="780" y="338">GALLERY</text>
    <text x="860" y="338">TESTIMONIALS</text>
    <text x="980" y="338">BLOG</text>
    <text x="1040" y="338">LINKS</text>
  </g>

  <!-- Body: dense paragraph + sidebar -->
  <g>
    <text x="60" y="400" font-family="'Times New Roman', Times, serif" font-size="22" fill="#5C3F1F" font-weight="bold">Welcome to Our Practice</text>
    <text x="60" y="436" font-family="Verdana, sans-serif" font-size="13" fill="#3D2F18">
      <tspan x="60" dy="0">We have been providing dental care since 1998 to families across the Greater</tspan>
      <tspan x="60" dy="18">Manchester area. Our friendly team is committed to providing high quality</tspan>
      <tspan x="60" dy="18">dentistry in a relaxed environment. Please click on a link to the left to find</tspan>
      <tspan x="60" dy="18">out more about our treatments, fees and team. New patients always welcome!</tspan>
    </text>

    <rect x="800" y="380" width="340" height="320" fill="#FFFFFF" stroke="#C7B894" />
    <text x="820" y="410" font-family="Verdana, sans-serif" font-size="14" font-weight="bold" fill="#5C3F1F">NEWS &amp; OFFERS</text>
    <text x="820" y="438" font-family="Verdana, sans-serif" font-size="11" fill="#3D2F18">- Free check-up for new patients (T&amp;Cs apply)</text>
    <text x="820" y="458" font-family="Verdana, sans-serif" font-size="11" fill="#3D2F18">- £49 hygienist (limited time)</text>
    <text x="820" y="478" font-family="Verdana, sans-serif" font-size="11" fill="#3D2F18">- We accept Denplan!</text>
    <text x="820" y="498" font-family="Verdana, sans-serif" font-size="11" fill="#3D2F18">- See our gallery ’</text>
    <rect x="820" y="530" width="300" height="120" fill="#F4E2C4" />
    <text x="970" y="600" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#7B5A28">[stock dentist photo]</text>
  </g>

  <!-- Footer -->
  <rect x="40" y="720" width="1120" height="60" fill="#A98C5A" />
  <text x="60" y="754" font-family="Verdana, sans-serif" font-size="12" fill="#FFFFFF">© 2008 Dr Smith Dental | Site by Webmaster Joe</text>

  <!-- Watermark -->
  <text x="1140" y="784" text-anchor="end" font-family="Verdana, sans-serif" font-size="11" fill="#5C3F1F" opacity="0.6">Before</text>
</svg>
